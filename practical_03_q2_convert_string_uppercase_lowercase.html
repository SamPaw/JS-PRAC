<!DOCTYPE html>
<html>
<head>
    <title>Convert String to Uppercase and Lowercase</title>
</head>
<body>
    <h2>String Case Conversion</h2>
    <script>
        let message = "Hello World From JavaScript";

        document.write("Original: " + message + "<br>");
        document.write("Uppercase: " + message.toUpperCase() + "<br>");
        document.write("Lowercase: " + message.toLowerCase());
    </script>
</body>
</html>
