<!DOCTYPE html>
<html>
<head>
    <title>Reverse a String</title>
</head>
<body>
    <h2>Reverse a String</h2>
    <script>
        let str = "JavaScript";
        let reversed = "";

        for (let i = str.length - 1; i >= 0; i--) {
            reversed += str.charAt(i);
        }

        document.write("Original String: " + str + "<br>");
        document.write("Reversed String: " + reversed);
    </script>
</body>
</html>
