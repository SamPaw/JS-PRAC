<!DOCTYPE html>
<html>
<head>
    <title>Text Box and Password Fields</title>
</head>
<body>
    <h2>Text Box and Password Fields</h2>
    <form>
        <label>Username:</label>
        <input type="text" id="uname"><br><br>

        <label>Password:</label>
        <input type="password" id="pass"><br><br>

        <button type="button" onclick="showCredentials()">Show Values</button>
    </form>

    <p id="result"></p>

    <script>
        function showCredentials() {
            let user = document.getElementById("uname").value;
            let password = document.getElementById("pass").value;

            document.getElementById("result").innerHTML =
                "Username entered: " + user + "<br>Password length: " + password.length;
        }
    </script>
</body>
</html>
