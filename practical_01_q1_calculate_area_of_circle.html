<!DOCTYPE html>
<html>
<head>
    <title>Area of Circle</title>
</head>
<body>
    <h2>Calculate Area of a Circle</h2>
    <script>
        let radius = 7;
        let area = Math.PI * radius * radius;

        document.write("Radius: " + radius + "<br>");
        document.write("Area of Circle: " + area.toFixed(2));
    </script>
</body>
</html>
