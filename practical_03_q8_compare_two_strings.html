<!DOCTYPE html>
<html>
<head>
    <title>Compare Two Strings</title>
</head>
<body>
    <h2>Compare Two Strings</h2>
    <script>
        let str1 = "Apple";
        let str2 = "Banana";

        document.write("String 1: " + str1 + "<br>");
        document.write("String 2: " + str2 + "<br>");

        if (str1 === str2) {
            document.write("Both strings are equal.<br>");
        } else if (str1 < str2) {
            document.write("'" + str1 + "' comes before '" + str2 + "' alphabetically.<br>");
        } else {
            document.write("'" + str1 + "' comes after '" + str2 + "' alphabetically.<br>");
        }
    </script>
</body>
</html>
