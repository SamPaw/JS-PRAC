<!DOCTYPE html>
<html>
<head>
    <title>Navigation Menu with Rollover Effects</title>
    <style>
        .menu-link {
            display: inline-block;
            padding: 10px 18px;
            margin: 5px;
            background-color: #f0f0f0;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h2>Navigation Menu with JavaScript Rollover Effect</h2>

    <a href="#" class="menu-link" onmouseover="menuHover(this)" onmouseout="menuOut(this)">Home</a>
    <a href="#" class="menu-link" onmouseover="menuHover(this)" onmouseout="menuOut(this)">About</a>
    <a href="#" class="menu-link" onmouseover="menuHover(this)" onmouseout="menuOut(this)">Courses</a>
    <a href="#" class="menu-link" onmouseover="menuHover(this)" onmouseout="menuOut(this)">Contact</a>

    <script>
        function menuHover(el) {
            el.style.backgroundColor = "#007BFF";
            el.style.color = "#FFFFFF";
        }

        function menuOut(el) {
            el.style.backgroundColor = "#f0f0f0";
            el.style.color = "#333333";
        }
    </script>
</body>
</html>
