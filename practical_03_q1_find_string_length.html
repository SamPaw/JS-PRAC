<!DOCTYPE html>
<html>
<head>
    <title>Find Length of String</title>
</head>
<body>
    <h2>Length of a String</h2>
    <script>
        let text = "Welcome to JavaScript!";
        let length = text.length;

        document.write("String: '" + text + "'<br>");
        document.write("Length of the string: " + length);
    </script>
</body>
</html>
