<!DOCTYPE html>
<html>
<head>
    <title>Factorial of a Number</title>
</head>
<body>
    <h2>Factorial of a Number</h2>
    <script>
        let n = 5;
        let factorial = 1;

        for (let i = 1; i <= n; i++) {
            factorial *= i;
        }

        document.write("Number: " + n + "<br>");
        document.write("Factorial: " + factorial);
    </script>
</body>
</html>
