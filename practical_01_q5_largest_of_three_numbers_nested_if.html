<!DOCTYPE html>
<html>
<head>
    <title>Largest Among Three Numbers</title>
</head>
<body>
    <h2>Largest of Three Numbers (Nested If)</h2>
    <script>
        let a = 25;
        let b = 40;
        let c = 15;
        let largest;

        if (a >= b) {
            if (a >= c) {
                largest = a;
            } else {
                largest = c;
            }
        } else {
            if (b >= c) {
                largest = b;
            } else {
                largest = c;
            }
        }

        document.write("Numbers: " + a + ", " + b + ", " + c + "<br>");
        document.write("Largest Number: " + largest);
    </script>
</body>
</html>
