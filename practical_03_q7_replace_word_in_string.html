<!DOCTYPE html>
<html>
<head>
    <title>Replace Word in a String</title>
</head>
<body>
    <h2>Replace a Word in a String</h2>
    <script>
        let text = "I love Java programming.";
        let replacedText = text.replace("Java", "JavaScript");

        document.write("Before: " + text + "<br>");
        document.write("After replace: " + replacedText);
    </script>
</body>
</html>
