<!DOCTYPE html>
<html>
<head>
    <title>Reverse Array Elements</title>
</head>
<body>
    <h2>Reverse Array Elements</h2>
    <script>
        let letters = ["A", "B", "C", "D", "E"];
        document.write("Original array: " + letters.join(", ") + "<br>");

        letters.reverse();
        document.write("Reversed array: " + letters.join(", "));
    </script>
</body>
</html>
