<!DOCTYPE html>
<html>
<head>
    <title>Validate Password using RegEx</title>
</head>
<body>
    <h2>Password Validation</h2>
    <p>Rule: Minimum 8 characters, at least one letter, and at least one digit.</p>

    <label>Enter Password:</label><br>
    <input type="password" id="userPass">
    <button type="button" onclick="validatePassword()">Validate Password</button>

    <p id="passMsg"></p>

    <script>
        function validatePassword() {
            let pass = document.getElementById("userPass").value;
            let passPattern = /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;
            let msg = document.getElementById("passMsg");

            if (passPattern.test(pass)) {
                msg.style.color = "green";
                msg.innerText = "Strong and Valid Password.";
            } else {
                msg.style.color = "red";
                msg.innerText = "Invalid Password: Must be at least 8 chars with 1 letter & 1 digit.";
            }
        }
    </script>
</body>
</html>
