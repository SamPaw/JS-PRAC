<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd Check</title>
</head>
<body>
    <h2>Check Even or Odd</h2>
    <script>
        let num = 15;

        if (num % 2 === 0) {
            document.write(num + " is an Even number.");
        } else {
            document.write(num + " is an Odd number.");
        }
    </script>
</body>
</html>
