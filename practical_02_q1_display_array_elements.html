<!DOCTYPE html>
<html>
<head>
    <title>Display Array Elements</title>
</head>
<body>
    <h2>Display Array Elements</h2>
    <script>
        let numbers = [10, 20, 30, 40, 50];

        document.write("<h3>Traversing Array:</h3>");
        for (let i = 0; i < numbers.length; i++) {
            document.write("Element at index " + i + " : " + numbers[i] + "<br>");
        }
    </script>
</body>
</html>
