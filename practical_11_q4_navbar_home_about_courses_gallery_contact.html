<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar (Home, About, Courses, Gallery, Contact)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .navbar {
            background-color: #222;
            overflow: hidden;
            border-radius: 5px;
        }
        .navbar a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-size: 17px;
            cursor: pointer;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        .navbar a.active {
            background-color: #4CAF50;
            color: white;
        }
        #navContent {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h2>Navigation Bar Implementation</h2>

    <div class="navbar" id="topNavbar">
        <a class="nav-link active" onclick="activateLink(this, 'Home')">Home</a>
        <a class="nav-link" onclick="activateLink(this, 'About')">About</a>
        <a class="nav-link" onclick="activateLink(this, 'Courses')">Courses</a>
        <a class="nav-link" onclick="activateLink(this, 'Gallery')">Gallery</a>
        <a class="nav-link" onclick="activateLink(this, 'Contact')">Contact</a>
    </div>

    <div id="navContent">
        <h3 id="currentNav">Home Page</h3>
        <p>Welcome to the main homepage of the site.</p>
    </div>

    <script>
        function activateLink(element, pageName) {
            let links = document.getElementsByClassName("nav-link");
            for (let i = 0; i < links.length; i++) {
                links[i].className = "nav-link";
            }
            element.className = "nav-link active";

            document.getElementById("currentNav").innerText = pageName + " Page";
        }
    </script>
</body>
</html>
