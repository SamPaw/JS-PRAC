<!DOCTYPE html>
<html>
<head>
    <title>Button Click Welcome Message</title>
</head>
<body>
    <h2>Welcome Message on Button Click</h2>

    <button onclick="showWelcome()">Click for Welcome Message</button>

    <script>
        function showWelcome() {
            alert("Welcome to JavaScript Programming Lab!");
        }
    </script>
</body>
</html>
