<!DOCTYPE html>
<html>
<head>
    <title>Dropdown onchange Selected Value</title>
</head>
<body>
    <h2>Display Selected Value using onchange</h2>

    <label>Select a Programming Language:</label><br>
    <select id="langSelect" onchange="showSelection(this.value)">
        <option value="">-- Choose One --</option>
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="Java">Java</option>
        <option value="C++">C++</option>
    </select>

    <h3 id="display"></h3>

    <script>
        function showSelection(selectedValue) {
            let disp = document.getElementById("display");
            if (selectedValue) {
                disp.innerText = "Selected Language: " + selectedValue;
            } else {
                disp.innerText = "";
            }
        }
    </script>
</body>
</html>
